services:
    postgres:
        image: postgres:16-alpine
        container_name: zawosite_postgres_prod
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - postgres_prod_data:/var/lib/postgresql/data
        networks:
            - app_network

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: zawosite_api_prod
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_HOST: ${POSTGRES_HOST}
            POSTGRES_PORT: ${POSTGRES_PORT}
            POSTGRES_DB: ${POSTGRES_DB}
            PORT: 4000
            DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
            DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
            JWT_SECRET: ${JWT_SECRET}
            FRONTEND_URL: ${FRONTEND_URL}
            NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        depends_on:
            - postgres
        ports:
            - '127.0.0.1:4000:4000'
        networks:
            - app_network

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        container_name: zawosite_web_prod
        restart: always
        environment:
            PORT: 3000
            NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        depends_on:
            - api
        ports:
            - '127.0.0.1:3000:3000'
        networks:
            - app_network

volumes:
    postgres_prod_data:

networks:
    app_network:
        driver: bridge
